name: Update model data

# Auto-fetches the model's external data from GitHub's network (which usually
# isn't blocked the way Streamlit Cloud's servers are) and commits it for the
# deployed app to read:
#   * team zone/man coverage  -> scheme_data/coverage_<season>.csv
#   * Sharp Football tables    -> sharp_data/<key>_<season>.csv (the lifeblood)
# It also snapshots the model state (Evolution Engine) and self-tunes weekly.

on:
  schedule:
    # 09:00 UTC every Tuesday (after Monday Night Football, in-season).
    - cron: "0 9 * * 2"
  workflow_dispatch: {}  # lets you run it on demand from the Actions tab

permissions:
  contents: write  # needed to commit the refreshed CSV back to the branch

concurrency:
  group: update-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch this ran on
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install headless Chromium (for JS-rendered pages)
        run: python -m playwright install --with-deps chromium

      - name: Fetch and blend coverage
        id: fetch
        # Don't fail the job if the sites block us — we just skip the commit.
        # No --season: the script defaults to config.CURRENT_SEASON.
        run: |
          set +e
          python scripts/fetch_coverage.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Fetch Sharp Football tables (the data lifeblood)
        id: sharp
        # Scrapes all 10 Sharp Football stat pages into sharp_data/*.csv. Same
        # deal: exit 2 if every page was blocked, and we just skip its commit.
        run: |
          set +e
          python scripts/fetch_sharp.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Snapshot model state (Evolution Engine)
        id: snapshot
        # Freezes this week's ranks + projections into history/. Exits 2 in the
        # offseason (no current-season games), which we treat as "nothing to do".
        run: |
          set +e
          python scripts/snapshot.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Self-tune from results (learning loop)
        id: tune
        # Grades the season, re-fits POINTS_WEIGHT + facet weights toward what's
        # predicting, and writes model_tuning.json. Exits 2 until enough games.
        run: |
          set +e
          python scripts/tune.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Review games vs facets (auditable hit rates)
        id: review
        # Cross-references every flagged facet edge against the actual result and
        # writes per-facet hit rates to review_log.csv. Exits 2 until games exist.
        run: |
          set +e
          python scripts/review.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed data
        if: steps.fetch.outputs.exit_code == '0' || steps.sharp.outputs.exit_code == '0' || steps.snapshot.outputs.exit_code == '0' || steps.tune.outputs.exit_code == '0' || steps.review.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # add each path independently — a missing glob (e.g. history/ in the
          # offseason) must not abort staging the files that DO exist.
          git add -f scheme_data/coverage_*.csv 2>/dev/null || true
          git add -f sharp_data/*.csv 2>/dev/null || true
          git add -f history/*.csv 2>/dev/null || true
          git add -f model_tuning.json tuning_log.csv review_log.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data change since last run."
          else
            git commit -m "Auto-update: coverage + Sharp + snapshot + self-tune + review [skip ci]"
            # The branch can move while this job runs (code pushes). Rebase the
            # auto-commit onto the latest remote and retry so the data isn't lost
            # to a non-fast-forward rejection.
            pushed=0
            for i in 1 2 3 4; do
              if git push origin HEAD:${{ github.ref_name }}; then pushed=1; break; fi
              echo "push rejected — rebasing onto latest remote (attempt $i)"
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }} || { git rebase --abort; break; }
              sleep 3
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::Could not push refreshed data after rebase retries."
              exit 1
            fi
          fi

      - name: Report blocked coverage sources
        if: steps.fetch.outputs.exit_code != '0'
        run: |
          echo "::warning::Coverage fetch returned no data \
          (exit ${{ steps.fetch.outputs.exit_code }}). The sources likely \
          blocked GitHub's runner too — use the sidebar CSV upload instead."
